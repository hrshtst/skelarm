[skeleton]
base_length = 0.05

[[skeleton.link]]
length = 0.1
mass = 0.5
inertia = 0.005
com = [0.05, 0.0]
limits = [-20.0, 30.0]

[[skeleton.link]]
length = 0.25
mass = 1.0
inertia = 0.01
com = [0.1, 0.0]
limits = [0.0, 120.0]

[[skeleton.link]]
length = 0.25
mass = 1.0
inertia = 0.007
com = [0.1, 0.0]
limits = [0.0, 150.0]

[[skeleton.link]]
length = 0.15
mass = 0.5
inertia = 0.003
com = [0.05, 0.0]
limits = [-20.0, 90.0]

[initial]
q = [-20.0, 10.0, 60.0, 50.0]  # degrees

[task]
type = "joint_trajectory_tracking"
file = "teach.sklog.npz"
filter = { kind = "butterworth", cutoff_hz = 8.0, order = 4 } # smooth a jaggy recording
interpolator = "cubic_spline"
# duration defaults to the reference's length when omitted
target = { pos = [0.0, 0.4], tolerance = 0.02 }  # endpoint goal (m), 2 cm success

[simulator]
dt = 0.002

[controller]
type = "computed_torque"
kp = 200.0
kd = 30.0

