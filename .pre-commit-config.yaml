repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe'] # mkdocs.yml uses the !!python/name: tag for Mermaid
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        exclude: '^docs/assets/' # demo media (GIFs/MP4s/logs) legitimately exceed the limit; everything else keeps it
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-symlinks
      - id: debug-statements

  # ruff runs from uv.lock (like basedpyright and mypy) so the hooks can't drift from `make lint`
  - repo: local
    hooks:
      # Run the linter and apply fixes
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
        require_serial: true
        args: [--fix, --exit-non-zero-on-fix, --config=pyproject.toml]
      # Run the formatter
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
        require_serial: true
      - id: basedpyright
        name: basedpyright
        entry: uv run basedpyright
        language: system
        types: [python]
        pass_filenames: false # basedpyright needs full project context, not just changed files
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false # mypy resolves its file set and config from pyproject.toml
